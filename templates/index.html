{% extends "base.html" %}
{% block title %}メーカー選択 | バイク整備早見表{% endblock %}

{% block content %}
<div class="page-hero">
  <h1>メーカーを選択</h1>
  <p class="subtitle">整備する車種のメーカーを選んでください</p>
</div>

<div class="maker-grid">
  {% for maker in makers %}
  <a href="{{ url_for('models', maker=maker) }}" class="maker-card">
    <span class="maker-name">{{ maker }}</span>
    <span class="maker-arrow">→</span>
  </a>
  {% endfor %}
</div>
{% endblock %}
